name: Build JARVIS Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --platforms=android --project-name jarvis_ai build_project
          cp pubspec.yaml build_project/pubspec.yaml
          cp lib/main.dart build_project/lib/main.dart

      - name: Get dependencies
        working-directory: build_project
        run: flutter pub get

      - name: Build APK
        working-directory: build_project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: build_project/build/app/outputs/flutter-apk/app-release.apk
          
